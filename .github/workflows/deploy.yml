name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: demos/shamir-gate
        run: npm install

      # The vitest suites: math (the prime field and Lagrange interpolation),
      # shares, crypto, and the ui smoke pass. This is the only workflow in the
      # repo, so before this step they ran nowhere in CI at all — a broken
      # field arithmetic could publish so long as the page stayed accessible.
      # `test:run`, NOT `test`: the latter is bare `vitest`, which is watch mode
      # and would hang the job forever.
      - name: Unit tests
        working-directory: demos/shamir-gate
        run: npm run test:run

      - name: Build
        working-directory: demos/shamir-gate
        run: npm run build

      - name: Install Playwright browser
        working-directory: demos/shamir-gate
        run: npx playwright install --with-deps chromium

      # `test:a11y` is bare `playwright test` — the same command as `test:e2e` —
      # so this also runs claims.spec.ts and border-contrast.spec.ts.
      - name: Browser claims and accessibility gate
        working-directory: demos/shamir-gate
        run: npm run test:a11y

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demos/shamir-gate/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
